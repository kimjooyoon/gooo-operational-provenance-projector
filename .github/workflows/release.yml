name: Immutable operational provenance projector release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release version, for example 0.1.0
        required: true
        type: string
      merge_sha:
        description: Exact merge commit already verified by main CI
        required: true
        type: string
      main_run_id:
        description: Successful main conformance run ID for merge_sha
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      MERGE_SHA: ${{ inputs.merge_sha }}
      MAIN_RUN_ID: ${{ inputs.main_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merge_sha }}
          fetch-depth: 0
      - name: Verify exact merged commit and successful main run
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          main_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MAIN_RUN_ID")
          jq -e --arg sha "$MERGE_SHA" '.head_sha == $sha and .event == "push" and .conclusion == "success"' <<<"$main_run" >/dev/null
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: false
      - name: Verify Go toolchain
        run: test "$(go env GOVERSION)" = "go1.27.0"
      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          files=$(gofmt -l $(git ls-files '*.go'))
          test -z "$files"
      - name: Verify vet
        run: go vet ./...
      - name: Compile provenance package
        run: scripts/measure-stage.sh compile "$RUNNER_TEMP/stage-metrics/compile.json" go build -buildmode=archive -trimpath -o "$RUNNER_TEMP/gooo-operational-provenance-projector.a" ./internal/provenance
      - name: Build projector binary
        run: scripts/measure-stage.sh build "$RUNNER_TEMP/stage-metrics/build.json" go build -trimpath -o "$RUNNER_TEMP/gooo-operational-provenance-projector" ./cmd/gooo-operational-provenance-projector
      - name: Run Go tests and record events
        shell: bash
        run: scripts/measure-stage.sh test "$RUNNER_TEMP/stage-metrics/test.json" bash -c 'set -o pipefail; go test -json ./... | tee "$RUNNER_TEMP/go-test-events.jsonl"'
      - name: Run fixed denominator and provenance projection
        shell: bash
        run: scripts/measure-stage.sh conformance "$RUNNER_TEMP/stage-metrics/conformance.json" scripts/conformance.sh "$RUNNER_TEMP/gooo-operational-provenance-projector"
        env:
          CONFORMANCE_WORK_ROOT: ${{ runner.temp }}/conformance-work
          CONFORMANCE_COUNTS_OUT: ${{ runner.temp }}/conformance-counts.json
          PROVENANCE_PAIR_OUT: ${{ runner.temp }}/provenance-pair.json
      - name: Run caller-owned integration
        shell: bash
        run: scripts/measure-stage.sh integration "$RUNNER_TEMP/stage-metrics/integration.json" scripts/integration.sh "$RUNNER_TEMP/gooo-operational-provenance-projector"
        env:
          INTEGRATION_OUTPUT_ROOT: ${{ runner.temp }}/integration-output
      - name: Assemble release machine evidence
        run: scripts/assemble-ci-evidence.sh "$RUNNER_TEMP/stage-metrics" "$RUNNER_TEMP/go-test-events.jsonl" "$RUNNER_TEMP/conformance-counts.json" "$RUNNER_TEMP/integration-output/integration.json" "$RUNNER_TEMP/provenance-pair.json"
        env:
          CI_EVIDENCE_OUT: ${{ runner.temp }}/ci-evidence.json
          CONFORMANCE_WORK_ROOT: ${{ runner.temp }}/conformance-work
      - name: Verify source checkout remained unchanged
        run: test -z "$(git status --porcelain=v1)"
      - name: Resolve successful main CI artifact identity
        shell: bash
        run: |
          set -euo pipefail
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MAIN_RUN_ID/artifacts" | jq -c --arg prefix "gooo-operational-provenance-projector-ci-evidence-$MERGE_SHA" 'first(.artifacts[] | select(.name == $prefix) | {id,name,size_in_bytes,expired,digest})')
          test "$artifact" != null
          jq -e '.expired == false' <<<"$artifact" >/dev/null
          printf '%s\n' "$artifact" > "$RUNNER_TEMP/main-ci-artifact.json"
      - name: Create evidence bundle before tag and release mutation
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/gooo-operational-provenance-projector-evidence"
          mkdir -p "$bundle/projection"
          cp "$RUNNER_TEMP/ci-evidence.json" "$bundle/ci-evidence.json"
          cp "$RUNNER_TEMP/main-ci-artifact.json" "$bundle/main-ci-artifact.json"
          cp contracts/denominator-v1.json "$bundle/denominator-v1.json"
          cp contracts/receipt-chain-v1.json "$bundle/receipt-chain-v1.json"
          cp contracts/metrics-v1.json "$bundle/metrics-v1.json"
          cp .gooo/operational-provenance-projector.gooo "$bundle/operational-provenance-projector.gooo"
          cp fixtures/canonical-v1.json "$bundle/canonical-v1.json"
          cp fixtures/v0.49-static-validation-history.json "$bundle/v0.49-static-validation-history.json"
          cp -R "$RUNNER_TEMP/conformance-work/projection/." "$bundle/projection/"
          jq -n --arg version "${{ inputs.version }}" --arg merge_sha "$MERGE_SHA" --arg run_id "$GITHUB_RUN_ID" --arg job "$GITHUB_JOB" --slurpfile report "$RUNNER_TEMP/conformance-work/projection/report.json" \
            '{schema:"gooo/operational-provenance-projector/release-manifest/v1",version:$version,merge_sha:$merge_sha,release_run_id:$run_id,release_job_id:$job,denominator:$report[0].metrics.denominator,summary:$report[0].summary,authority:$report[0].authority,operational_audit:$report[0].operational_audit,receipt_chain:$report[0].receipt_chain,replay:$report[0].replay,inventory:$report[0].inventory}' > "$bundle/release-manifest.json"
          tar -czf "$RUNNER_TEMP/gooo-operational-provenance-projector-evidence.tar.gz" -C "$bundle" .
          sha256sum "$RUNNER_TEMP/gooo-operational-provenance-projector-evidence.tar.gz" | awk '{print "sha256:"$1}' > "$RUNNER_TEMP/source-asset-digest.txt"
      - name: Create annotated tag once
        shell: bash
        run: |
          set -euo pipefail
          tag="v${{ inputs.version }}"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "existing release tag must not be modified: $tag" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$MERGE_SHA" -m "gooo-operational-provenance-projector $tag"
          git push origin "$tag"
      - name: Create draft release through GitHub API
        id: draft
        shell: bash
        run: |
          set -euo pipefail
          tag="v${{ inputs.version }}"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" >/dev/null 2>&1; then
            echo "existing release must not be modified: $tag" >&2
            exit 1
          fi
          draft=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$tag" -f target_commitish="$MERGE_SHA" -f name="$tag" -f body="Immutable operational provenance projector release $tag." -F draft=true)
          release_id=$(jq -er '.id' <<<"$draft")
          printf 'release_id=%s\n' "$release_id" >> "$GITHUB_OUTPUT"
      - name: Create release audit asset from exact evidence
        shell: bash
        run: |
          set -euo pipefail
          tag="v${{ inputs.version }}"
          jq -n --arg schema "gooo/operational-provenance-projector/release-audit/v1" --arg tag "$tag" --arg merge_sha "$MERGE_SHA" --arg run_id "$GITHUB_RUN_ID" --arg job "$GITHUB_JOB" --arg main_run_id "$MAIN_RUN_ID" --arg release_id "${{ steps.draft.outputs.release_id }}" --arg source_digest "$(cat "$RUNNER_TEMP/source-asset-digest.txt")" --slurpfile artifact "$RUNNER_TEMP/main-ci-artifact.json" --slurpfile report "$RUNNER_TEMP/conformance-work/projection/report.json" \
            '{schema:$schema,tag:$tag,merge_sha:$merge_sha,release_id:($release_id|tonumber),release_run_id:$run_id,release_job_id:$job,source_asset:{name:"gooo-operational-provenance-projector-evidence.tar.gz",digest:$source_digest},main_ci:{run_id:$main_run_id,artifact:$artifact[0]},denominator:$report[0].metrics.denominator,exact_metrics:$report[0].metrics,summary:$report[0].summary,inventory:$report[0].inventory,authority:$report[0].authority,operational_audit:$report[0].operational_audit,receipt_chain:$report[0].receipt_chain,replay:$report[0].replay}' > "$RUNNER_TEMP/release-audit.json"
      - name: Upload assets to the draft release
        run: gh release upload "v${{ inputs.version }}" "$RUNNER_TEMP/gooo-operational-provenance-projector-evidence.tar.gz" "$RUNNER_TEMP/release-audit.json"
      - name: Enable and verify immutable release policy
        shell: bash
        run: |
          set -euo pipefail
          settings=$(gh api -X PUT "repos/$GITHUB_REPOSITORY/immutable-releases")
          jq -e '.enabled == true' <<<"$settings" >/dev/null
      - name: Publish draft exactly once
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/${{ steps.draft.outputs.release_id }}" -F draft=false
      - name: Verify immutable release, annotated tag, target, assets, and digests
        shell: bash
        run: |
          set -euo pipefail
          tag="v${{ inputs.version }}"
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/${{ steps.draft.outputs.release_id }}")
          jq -e --arg tag "$tag" --arg release_id "${{ steps.draft.outputs.release_id }}" '.id == ($release_id|tonumber) and .tag_name == $tag and .draft == false and .immutable == true and ([.assets[]] | length) == 2 and all(.assets[]; (.digest | type == "string" and startswith("sha256:")))' <<<"$release" >/dev/null
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")
          jq -e '.object.type == "tag"' <<<"$ref" >/dev/null
          tag_object=$(jq -er '.object.sha' <<<"$ref")
          tag_data=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object")
          jq -e --arg target "$MERGE_SHA" '.object.type == "commit" and .object.sha == $target' <<<"$tag_data" >/dev/null
          release_digest=$(jq -er --arg name "gooo-operational-provenance-projector-evidence.tar.gz" '.assets[] | select(.name == $name) | .digest' <<<"$release")
          test "$release_digest" = "$(cat "$RUNNER_TEMP/source-asset-digest.txt")"
          echo "immutable public release verified: $tag release_id=${{ steps.draft.outputs.release_id }} tag_object=$tag_object target=$MERGE_SHA"
